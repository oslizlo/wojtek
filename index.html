<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Łączenie urządzeń CSV</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>

body{
font-family:Arial;
padding:40px;
background:#f5f5f5;
}

h2{
margin-bottom:20px;
}

.panel{
background:white;
padding:20px;
border-radius:8px;
box-shadow:0 0 10px rgba(0,0,0,0.1);
margin-bottom:20px;
}

button{
padding:10px 18px;
margin:5px;
border:0;
background:#1976d2;
color:white;
border-radius:5px;
cursor:pointer;
}

button:hover{
background:#125ea6;
}

table{
border-collapse:collapse;
width:100%;
background:white;
}

th,td{
border:1px solid #ddd;
padding:6px 10px;
font-size:13px;
}

th{
background:#1976d2;
color:white;
}

tbody tr:nth-child(even){
background:#f2f2f2;
}

#info{
margin-top:10px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Łączenie urządzeń z CSV</h2>

<div class="panel">

<div>
Plik 1 (ID;AdresInst)<br>
<input type="file" id="file1">
</div>

<br>

<div>
Plik 2 (lista urządzeń)<br>
<input type="file" id="file2">
</div>

<br>

<button onclick="mergeData()">Połącz dane</button>
<button onclick="exportCSV()">Eksport CSV</button>
<button onclick="exportExcel()">Eksport Excel</button>

<p id="info"></p>

</div>

<table id="resultTable">

<thead>
<tr>
<th>LP</th>
<th>ID</th>
<th>AdresInst</th>
<th>Nazwa</th>
<th>Grupa</th>
<th>MAC</th>
<th>Serial</th>
</tr>
</thead>

<tbody></tbody>

</table>

<script>

let csv1=[]
let csv2=[]
let merged=[]

function normalizeHeader(h){

return h
.toLowerCase()
.replace(/\./g,"")
.replace(/ /g,"")
.trim()

}

function loadCSV(file,callback){

Papa.parse(file,{
header:true,
delimiter:";",
skipEmptyLines:true,
complete:function(results){

let data=results.data

let normalized=data.map(row=>{

let obj={}

Object.keys(row).forEach(k=>{
obj[normalizeHeader(k)]=row[k] ? row[k].toString().trim() : ""
})

return obj

})

callback(normalized)

}
})

}

document.getElementById("file1").addEventListener("change",function(e){

loadCSV(e.target.files[0],function(data){

csv1=data

})

})

document.getElementById("file2").addEventListener("change",function(e){

loadCSV(e.target.files[0],function(data){

csv2=data

})

})

function mergeData(){

merged=[]

let mapAdres={}

csv1.forEach(r=>{

mapAdres[r["id"]]=r["adresinst"]

})

csv2.forEach(r=>{

let id=r["cusid"]

if(mapAdres[id]){

merged.push({
id:id,
adresinst:mapAdres[id],
nazwa:r["nazwa"],
grupa:r["grupa"],
mac:r["mac"],
serial:r["serial"]
})

}

})

document.getElementById("info").innerText =
"Liczba urządzeń: "+merged.length

showTable()

}

function showTable(){

let tbody=document.querySelector("#resultTable tbody")

tbody.innerHTML=""

merged.forEach((r,i)=>{

let tr=document.createElement("tr")

tr.innerHTML=`
<td>${i+1}</td>
<td>${r.id}</td>
<td>${r.adresinst}</td>
<td>${r.nazwa}</td>
<td>${r.grupa}</td>
<td>${r.mac}</td>
<td>${r.serial}</td>
`

tbody.appendChild(tr)

})

}

function exportCSV(){

let rows=[
["LP","ID","AdresInst","Nazwa","Grupa","MAC","Serial"]
]

merged.forEach((r,i)=>{

rows.push([
i+1,
r.id,
r.adresinst,
r.nazwa,
r.grupa,
r.mac,
r.serial
])

})

let csv=Papa.unparse(rows,{delimiter:";"})

let blob=new Blob([csv],{type:"text/csv;charset=utf-8;"})

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url
a.download="urzadzenia.csv"
a.click()

}

function exportExcel(){

let rows=[
["LP","ID","AdresInst","Nazwa","Grupa","MAC","Serial"]
]

merged.forEach((r,i)=>{

rows.push([
i+1,
r.id,
r.adresinst,
r.nazwa,
r.grupa,
r.mac,
r.serial
])

})

let wb=XLSX.utils.book_new()

let ws=XLSX.utils.aoa_to_sheet(rows)

XLSX.utils.book_append_sheet(wb,ws,"Urzadzenia")

XLSX.writeFile(wb,"urzadzenia.xlsx")

}

</script>

</body>
</html>
