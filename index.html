<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Łączenie CSV</title>
<style>
body{
    font-family: Arial;
    padding:40px;
}
button{
    padding:10px 20px;
    margin:10px;
}
table{
    border-collapse:collapse;
    margin-top:20px;
}
td,th{
    border:1px solid #ccc;
    padding:6px 10px;
}
</style>
</head>

<body>

<h2>Łączenie danych z CSV</h2>

<div>
<label>Plik 1 (ID, nazwa, grupa)</label><br>
<input type="file" id="file1" accept=".csv">
</div>

<div>
<label>Plik 2 (cus.id, MAC, Serial)</label><br>
<input type="file" id="file2" accept=".csv">
</div>

<button onclick="mergeData()">Połącz dane</button>
<button onclick="downloadCSV()">Pobierz wynik CSV</button>

<table id="resultTable">
<thead>
<tr>
<th>ID</th>
<th>Nazwa</th>
<th>Grupa</th>
<th>MAC</th>
<th>Serial</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>

let csv1 = []
let csv2 = []
let merged = []

function parseCSV(text){
    const rows = text.split(/\r?\n/).filter(r=>r.trim()!="")
    const headers = rows[0].split(",")

    return rows.slice(1).map(row=>{
        const values = row.split(",")
        let obj = {}

        headers.forEach((h,i)=>{
            obj[h.trim()] = values[i] ? values[i].trim() : ""
        })

        return obj
    })
}

document.getElementById("file1").addEventListener("change",function(e){
    const reader = new FileReader()

    reader.onload = function(event){
        csv1 = parseCSV(event.target.result)
    }

    reader.readAsText(e.target.files[0])
})

document.getElementById("file2").addEventListener("change",function(e){
    const reader = new FileReader()

    reader.onload = function(event){
        csv2 = parseCSV(event.target.result)
    }

    reader.readAsText(e.target.files[0])
})

function mergeData(){

    merged = []

    const map = {}

    csv2.forEach(r=>{
        map[r["cus.id"]] = {
            mac: r["MAC"],
            serial: r["Serial"]
        }
    })

    csv1.forEach(r=>{

        const id = r["id"]

        if(map[id]){

            merged.push({
                id: id,
                nazwa: r["nazwa"],
                grupa: r["grupa"],
                mac: map[id].mac,
                serial: map[id].serial
            })

        }

    })

    showTable()
}

function showTable(){

    const tbody = document.querySelector("#resultTable tbody")
    tbody.innerHTML=""

    merged.forEach(r=>{

        const tr = document.createElement("tr")

        tr.innerHTML = `
        <td>${r.id}</td>
        <td>${r.nazwa}</td>
        <td>${r.grupa}</td>
        <td>${r.mac}</td>
        <td>${r.serial}</td>
        `

        tbody.appendChild(tr)

    })

}

function downloadCSV(){

    let csv = "ID,Nazwa,Grupa,MAC,Serial\n"

    merged.forEach(r=>{
        csv += `${r.id},${r.nazwa},${r.grupa},${r.mac},${r.serial}\n`
    })

    const blob = new Blob([csv],{type:"text/csv"})
    const url = URL.createObjectURL(blob)

    const a = document.createElement("a")
    a.href = url
    a.download = "wynik.csv"
    a.click()

}

</script>

</body>
</html>
