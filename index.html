<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Analiza CSV klientów</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f7fa;
}

h2 {
    margin-bottom: 10px;
}

button {
    padding: 10px 15px;
    margin: 5px 5px 15px 0;
    cursor: pointer;
    border: none;
    background: #2c7be5;
    color: white;
    border-radius: 6px;
}

button:hover {
    background: #1a68d1;
}

input[type="file"] {
    margin-bottom: 10px;
}

#status {
    margin: 10px 0;
    font-weight: bold;
}

table {
    border-collapse: collapse;
    width: 100%;
    background: white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    font-size: 14px;
}

th {
    background: #eef2f7;
    text-align: left;
}

tr:nth-child(even) {
    background: #fafafa;
}

.total-row {
    font-weight: bold;
    background: #e6f0ff;
}
</style>
</head>
<body>

<h2>Wczytaj plik CSV klientów</h2>

<input type="file" id="fileInput" accept=".csv">
<br>
<button onclick="groupByID()">Grupuj po ID</button>
<button onclick="sumByCustomer()">Sumuj wartości klientów (NETTO + BRUTTO)</button>

<div id="status"></div>
<div id="output"></div>

<script>
let csvData = [];

// ====== Parser CSV (obsługa cudzysłowów i przecinków) ======
function parseCSV(text) {
    const rows = [];
    const lines = text.replace(/\r/g, '').split('\n');

    if (lines.length === 0) return rows;

    // usuń pustą linię na końcu
    if (lines[lines.length - 1].trim() === "") {
        lines.pop();
    }

    const headers = parseCSVLine(lines[0]);

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;

        const values = parseCSVLine(lines[i]);

        if (values.length === headers.length) {
            let obj = {};
            headers.forEach((header, index) => {
                obj[header.trim()] = values[index];
            });
            rows.push(obj);
        }
    }

    return rows;
}

// ====== Rozbijanie linii CSV z uwzględnieniem cudzysłowów ======
function parseCSVLine(line) {
    const result = [];
    let current = "";
    let inQuotes = false;

    for (let i = 0; i < line.length; i++) {
        const char = line[i];

        if (char === '"') {
            inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
            result.push(current);
            current = "";
        } else {
            current += char;
        }
    }
    result.push(current);

    return result.map(v => v.replace(/^"|"$/g, '').trim());
}

// ====== Wczytywanie pliku CSV ======
document.getElementById("fileInput").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(event) {
        const text = event.target.result;
        csvData = parseCSV(text);

        document.getElementById("status").innerHTML =
            "Plik wczytany poprawnie. Liczba rekordów: " + csvData.length;

        // Wyświetl dane od razu
        displayFullTable(csvData);
        console.log("Wczytane dane:", csvData);
    };

    // Ważne dla polskich znaków
    reader.readAsText(file, "UTF-8");
});

// ====== Sortowanie po ID klienta ======
function groupByID() {
    if (csvData.length === 0) {
        alert("Najpierw wczytaj plik CSV!");
        return;
    }

    const sorted = [...csvData].sort((a, b) =>
        Number(a.customer_id) - Number(b.customer_id)
    );

    displayFullTable(sorted);
}

// ====== Sumowanie po kliencie (NETTO + BRUTTO + data + taryfa) ======
function sumByCustomer() {
    if (csvData.length === 0) {
        alert("Najpierw wczytaj plik CSV!");
        return;
    }

    const map = {};

    csvData.forEach(row => {
        const id = row.customer_id;
        const netto = parseFloat(row.netto) || 0;
        const brutto = parseFloat(row.brutto) || 0;

        if (!map[id]) {
            map[id] = {
                customer_id: id,
                klient: row.klient,
                nazwa_taryfy: row.nazwa_taryfy,
                typ_taryfy: row.typ_taryfy,
                dataod: row.dataod,
                suma_netto: 0,
                suma_brutto: 0
            };
        }

        map[id].suma_netto += netto;
        map[id].suma_brutto += brutto;
    });

    const result = Object.values(map).sort((a, b) =>
        Number(a.customer_id) - Number(b.customer_id)
    );

    displaySummaryTable(result);
}

// ====== Tabela pełnych danych ======
function displayFullTable(data) {
    let html = `
    <table>
        <tr>
            <th>ID</th>
            <th>Klient</th>
            <th>Nazwa taryfy</th>
            <th>Typ taryfy</th>
            <th>Data od</th>
            <th>Netto</th>
            <th>Brutto</th>
        </tr>`;

    data.forEach(row => {
        html += `
        <tr>
            <td>${row.customer_id}</td>
            <td>${row.klient}</td>
            <td>${row.nazwa_taryfy}</td>
            <td>${row.typ_taryfy}</td>
            <td>${row.dataod}</td>
            <td>${row.netto}</td>
            <td>${row.brutto}</td>
        </tr>`;
    });

    html += "</table>";
    document.getElementById("output").innerHTML = html;
}

// ====== Tabela podsumowania księgowego + GRAND TOTAL ======
function displaySummaryTable(data) {
    let totalNetto = 0;
    let totalBrutto = 0;

    let html = `
    <table>
        <tr>
            <th>ID Klienta</th>
            <th>Klient</th>
            <th>Nazwa taryfy</th>
            <th>Typ taryfy</th>
            <th>Data od</th>
            <th>Suma Netto</th>
            <th>Suma Brutto</th>
        </tr>`;

    data.forEach(row => {
        totalNetto += row.suma_netto;
        totalBrutto += row.suma_brutto;

        html += `
        <tr>
            <td>${row.customer_id}</td>
            <td>${row.klient}</td>
            <td>${row.nazwa_taryfy}</td>
            <td>${row.typ_taryfy}</td>
            <td>${row.dataod}</td>
            <td>${row.suma_netto.toFixed(2)}</td>
            <td>${row.suma_brutto.toFixed(2)}</td>
        </tr>`;
    });

    html += `
        <tr class="total-row">
            <td colspan="5">ŁĄCZNA SUMA WSZYSTKICH KLIENTÓW</td>
            <td>${totalNetto.toFixed(2)}</td>
            <td>${totalBrutto.toFixed(2)}</td>
        </tr>
    </table>`;

    document.getElementById("output").innerHTML = html;
}
</script>

</body>
</html>
