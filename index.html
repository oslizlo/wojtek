<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Lista klientów z CSV</title>
<style>
    body { font-family: Arial; padding: 20px; }
    ul { margin-top: 20px; }
    #status { margin-top: 10px; color: red; }
</style>
</head>
<body>

<h2>Wczytaj plik CSV z klientami</h2>
<input type="file" id="fileInput" accept=".csv">
<div id="status"></div>
<ul id="lista"></ul>

<script>
const input = document.getElementById("fileInput");
const lista = document.getElementById("lista");
const statusDiv = document.getElementById("status");

input.addEventListener("change", handleFile);

function handleFile(event) {
    const file = event.target.files[0];
    if (!file) {
        statusDiv.textContent = "Nie wybrano pliku.";
        return;
    }

    statusDiv.textContent = "Wczytywanie pliku...";
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const text = e.target.result;
            console.log("Surowy CSV:", text);

            const klienci = parseCSV(text);

            if (klienci.length === 0) {
                statusDiv.textContent = "Plik CSV jest pusty lub ma zły format.";
                return;
            }

            const posortowani = sortujAlfabetycznie(klienci);
            wyswietlListe(posortowani);
            statusDiv.textContent = `Wczytano ${posortowani.length} klientów.`;
        } catch (err) {
            statusDiv.textContent = "Błąd podczas przetwarzania pliku: " + err.message;
            console.error(err);
        }
    };

    reader.onerror = () => {
        statusDiv.textContent = "Błąd odczytu pliku.";
    };

    reader.readAsText(file, "UTF-8");
}
