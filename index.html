<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Sortowanie klientów z CSV</title>
<style>
    body { font-family: Arial; padding: 20px; }
    button { margin-top: 10px; padding: 8px 15px; cursor: pointer; }
    ul { margin-top: 20px; }
    #status { margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<h2>Wczytaj plik CSV z klientami</h2>

<input type="file" id="fileInput" accept=".csv">
<br>
<button id="sortBtn">Sortuj alfabetycznie</button>

<div id="status">Status: Nie wczytano pliku</div>
<ul id="lista"></ul>

<script>
let wczytaniKlienci = [];

const fileInput = document.getElementById("fileInput");
const sortBtn = document.getElementById("sortBtn");
const lista = document.getElementById("lista");
const statusDiv = document.getElementById("status");

// KROK 1: Wczytywanie pliku (bez sortowania)
fileInput.addEventListener("change", function(event) {
    const file = event.target.files[0];

    if (!file) {
        statusDiv.textContent = "Status: Nie wybrano pliku.";
        return;
    }

    statusDiv.textContent = "Status: Wczytywanie pliku...";
    const reader = new FileReader();

    reader.onload = function(e) {
        try {
            const text = e.target.result;
            wczytaniKlienci = parseCSV(text);

            if (wczytaniKlienci.length === 0) {
                statusDiv.textContent = "Status: Nie wykryto danych w pliku CSV.";
            } else {
                statusDiv.textContent = `Status: Wczytano ${wczytaniKlienci.length} klientów. Kliknij 'Sortuj alfabetycznie'.`;
            }
        } catch (error) {
            console.error(error);
            statusDiv.textContent = "Status: Błąd odczytu CSV.";
        }
    };

    reader.readAsText(file, "UTF-8");
});
